version: '3.8'

services:

  mongo:
    image: w205_mongo
    volumes:
      - /home/w205/docker/mounts/mongo/data:/data/db
    expose:
      - "27017"
    ports:
      - "27017:27017"

  anaconda:
    image: w205_anaconda
    stdin_open: true
    tty: true
    volumes:
      - /home/w205/user:/user
      - /home/w205/docker/mounts/anaconda/environments:/opt/conda/envs
    expose:
      - "8888"
    ports:
      - "8888:8888"


